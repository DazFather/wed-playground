<style>
	display: flex;

	.tab {
		padding: 0;
		background-color: var(--color-bg);

		button {
			padding: var(--unit-small);
		}

		.open-btn {
			width: 100%;
		}
		.close-btn {
			margin: var(--unit-mini) var(--unit-mini) 0 0;
			height: auto;
			align-self: flex-start;
			padding: 0;
			> * {
				display: inline-block;
				padding: var(--unit-mini);
				padding-bottom: 0;
				font-size: 0.75em;
			}
			
		}
		.close-btn:hover {
			background-color: indianred;
		}
	}
	.tab.active {
		margin-bottom: calc(var(--unit-small) * -1);
		border-radius: var(--unit-small) var(--unit-small) 0 0;
	}

	.adder {
		input {
			width: 0;
			padding: 0;
			overflow: hidden;
			transition-duration: var(--speed);
			transition-delay: var(--speed);
		}
	}
	.adder:hover{
		button:hover {
			background-color: indianred;
		}
		input {
			transition-properties: width; 
			padding: var(--unit-mini);
			width: 25ch;
		}
	}
</style>
<html>
	<template id="tab-template">
		<div class="tab inline-flex-center active">
			<button type="button" class="open-btn" onclick="view(this.value, this.parentElement)" value="test">test</button>
			<button type="button" class="close-btn" onclick="remove(this.value, this.parentElement)" value="test">{{ use "icon-trash" }}</button>
		</div>
	</template>
	<div class="adder flex-center">
		<button type="button" onclick="create(adderFilename.value)">
			{{ use "icon-fileadd" }}
		</button>
		<input type="text">
	</div>
	{{ range $ind, $val := .Props "starters" }}
	{{ if eq $ind 0 }}
	<div class="tab inline-flex-center active">
	{{ else }}
	<div class="tab inline-flex-center">
	{{ end }}
		<button type="button" class="open-btn" onclick="view(this.value, this.parentElement)" value="{{ $val }}">{{ $val }}</button>
	</div>
	{{ end }}
	
</html>
<script>
	const holder = select(".tabs-component")
	const tabtmpl = useTemplate("tab-template", tmpl => tmpl._init = (name) => {
		const tab = tmpl.children[0]
		tab.firstElementChild.innerText = name
		tab.firstElementChild.value = name
		tab.lastElementChild.value = name
		return tab
	})
	const adderFilename = useMirror(holder.querySelector(".adder > input"), "value")
	const opened = new Set(Array.from(holder.querySelectorAll(".tab > .open-btn"), e => e.value))
	const activeTab = useEffect(holder.querySelector(".active"), (item, prev) => {
		if (!!prev) prev.classList.remove("active")
		item.classList.add("active")
		return item
	})

	async function view(name, tab) {
		editor.content = await http.GET(name)
		activeTab.value = tab
	}

	async function create(name=adderFilename.value, content='<html>\n\tHello world!\n</html>') {
		return http.PUT(name, content)
			.then(out => {
				const tab = tabtmpl.clone()._init(name)
				activeTab.value = tab
				holder.appendChild(tab)
				opened.add(name)
				editor.content = content
				refresh()
				show(out)
			})
			.catch(({ body }) => showAlert({type: 'warning', title: "Something went wrong :/", description: body}))
			.finally(() => adderFilename.value = "")
	}

	function remove(name, tab) {
		return http.DELETE(name).then(out => {
			holder.removeChild(tab)
			s.delete(name)
			show(out)
			refresh()
		})
		.catch(({ body }) => showAlert({type: 'warning', title: "Something went wrong :/", description: body}))
	}

</script>
