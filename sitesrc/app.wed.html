<style>
	--speed: 0.25s;

	.page {
		width: 100vw;
		height: 100vh;
		overflow: auto;
		transition: height var(--speed);
	}
	.hidden {
		overflow: hidden;
		height: 0;
	}

</style>
<html>
	{{ use "alert-holder" }}
	{{ use "theme-switcher" ( args "themes" (list "system" "light" "dark") ) }}
	<section id="welcome" class="page">
		{{ use "welcome-page" }}
	</section>
	<main id="editor-wrapper" class="hidden page">
		{{ use "editor-page" }}
	</main>
</html>
