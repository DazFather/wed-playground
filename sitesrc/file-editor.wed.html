<style>
	input, textarea, button {
		width: max(100%, var(--unit));
		height: 100%;
		padding: var(--unit-small);
	}

	btn {

		> * {
			border-radius: inherit;
		}

		button {
			width: min-content;
		}

		.build-btn {
			background-color: crimson;
		}
	}

	.spacer {
		width: 100%;
	}
</style>
<html>
	<btn class="flex-center">
		<div class="spacer"></div>
		<button type="button" class="build-btn" onclick="run()">
			{{ use "icon-play" }}
		</button>
	</btn>
	<textarea bind="value:{{ .Props "bindcontent" }}:input" wrap="off" autofocus></textarea>
</html>
