<style>
	input, textarea , button {
		width: max(100%, var(--unit));
		height: 100%;
		padding: var(--unit-small);
	}

	btn {
		border-radius: inherit;
		> * {
			border-radius: inherit;
		}

		button {
			width: min-content;
		}
	}
</style>
<html>
	<section class="editor-section sideview">
		<btn class="flex-center">
			<input type="text" bind="value:{{ .Props "bindname" }}:input">
			<button type="button" onclick="run(playID.value)">
				<i class="fa fa-send-o"></i>
			</button>
			<button type="button" onclick="refresh(playID.value)">
				<i class="fa fa-eye"></i>
			</button>
		</btn>
		<textarea bind="value:{{ .Props "bindcontent" }}:input" wrap="off" autofocus></textarea>
	</section>
</html>
