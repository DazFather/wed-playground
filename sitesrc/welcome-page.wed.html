<style>
	display: grid;
	place-content: center;
	font-size: 1.75em;
	background-image: linear-gradient(
		45deg,
		light-dark(hsl(0, 100%, 55%),   hsl(0, 100%, 35%)),
		light-dark(hsl(180, 100%, 55%), hsl(180, 100%, 35%))
	);
	height: 100%;
	width: 100%;
</style>
<html>
	<button id="connect-btn" onclik="connect()" disabled>CONNECT</button>
</html>
<script require="editor alert">
	const editorPage = useMirror(select("#editor-wrapper"), "classList")
	const welcomePage = useMirror(select("#welcome"), "classList")
	const connectBtn = useMirror(select("#connect-btn"), ["disabled", "innerText"])

	function connect() {
		connectBtn.disabled = true
		connectBtn.innerText = "Connecting..."
		return http.CONNECT().then(id => {
			if (opened.size > 0) {
				view(opened.values().next().value, activeTab.value)
			}
			connectBtn.innerText = "CONNECT"
			editorPage.classList.toggle('hidden')
			welcomePage.classList.toggle('hidden')
			refresh()
		})
		.catch(({ body }) => showAlert({type:'warning', title:"Could not connect, Retry later", description: body}))
		.finally(() => connectBtn.disabled = false)
	}
	connect()

</script>
