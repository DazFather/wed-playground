<style>
	display: grid;
	place-content: center;
	font-size: 1.75em;
	background-image: linear-gradient(
		45deg,
		light-dark(hsl(0, 100%, 55%),   hsl(0, 100%, 35%)),
		light-dark(hsl(180, 100%, 55%), hsl(180, 100%, 35%))
	);
	height: 100%;
	width: 100%;
</style>
<html>
	<button id="connect-btn" onclik="connect()" disable>CONNECT</button>
</html>
<script require="editor">
	const editorPage = useMirror(select("#editor-wrapper"), "classList")
	const welcomePage = useMirror(select("#welcome"), "classList")
	const connectBtn = useMirror(select("#connect-btn"), "disable")

	function connect() {
		connectBtn.disable = true
		return http("/connect").then(id => {
			editorPage.classList.toggle('hidden')
			welcomePage.classList.toggle('hidden')
			playID.value = id;
			if (opened.size > 0) {
				view(opened.values().next().value, activeTab.value)
			}
		}).finally(() => connectBtn.disable = false)
	}
	connect()

</script>
