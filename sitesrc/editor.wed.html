<style>
	display: flex;
	width: 100%;
	height: 75%;

	> * {
		display: flex;
		flex-direction: column;
		width: 100%;
		height: 100%;
	}

	.editor-section{
		textarea {
			resize: horizontal;
			width: 100%;
			height: 100%;
		}
	}

	.preview-section{
		padding: 0;
		margin: 0;
		
		iframe {
			width: 100%;
			height: 100%;
		}
	}
</style>
<html>
	<section class="editor-section">
		<input type="text" bind="value:file:input">
		<textarea bind="value:content:input" wrap="off" autofocus></textarea>
	</section>
	<figure class="preview-section">
		<iframe
			bind="src:preview"
			id="preview"
			name="preview"
			src="/preview/std/"
		></iframe>
		<figcaption>
			<a bind="href:preview" href="" target="_preview">PREVIEW</a>
		</figcaption>
	</figure>
</html>
<script>
	const editor = useBinds(".editor-component")
	editor.file = "app.wed.html"
</script>
