<style>
	display: flex;
	flex-direction: column;
	height: 100%;
	background-color: var(--dark-carbon, gray);
	border-radius: var(--unit);
	overflow: hidden;
	border: var(--unit-mini) solid var(--dark-carbon, gray); 
	gap: var(--unit-mini); 

	.sideview-wrapper {
		height: 75%;
		gap: inherit;
		
		.sideview {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			border-radius: var(--unit-small);
			overflow: hidden;
			gap: var(--unit-mini);

			* {
				gap: inherit;
				border-radius: var(--unit-mini);
			}
		}
	}

	button, input, textarea, figure, iframe {
		margin: 0;
		padding: 0;
		border: none;
		outline: none;
		resize: none;
		background-color: var(--color-bg);
		transition-duration: var(--speed);
		transition-properties: all;
	}

	.terminal {
		height: 25%;
	}

</style>
<html>
	<section class="flex-center sideview-wrapper">
		<div class="sideview">
			{{ use "file-editor" ( args "bindcontent" "content" ) }}
		</div>
		<aside class="sideview">
			{{ use "preview" ( args "bindframe" "preview" ) }}
		</aside>
	</section>
	<aside class="terminal">
		{{ use "term" ( args 
			"title"       "wed build"
			"placeholder" "Project initialized"
		) }}
	</aside>
</html>
<script require="alert alert-holder">
	const show = useDisplay("#term")

	const editor = useBinds(".editor-component")

	function run() {
		const name = activeTab.value.querySelector(".open-btn").value
		return http.PUT(name, editor.content)
			.then(out => { show(out); refresh() })
			.catch(({ body }) => showAlert({type: 'warning', title: "Something went wrong :/", description: body}))
	}

	function refresh(id=http.playID) {
		editor.preview = `${location.origin}/preview/${ id }/`
	}

	const http = {

		playID: "std",

		async CONNECT() {
			const res = await fetch("/connect", {method: 'GET', cache: "no-store"})
			if (!res.ok && res.status !== 400) throw {status: res.status, body: await res.text()}
			return this.playID = await res.text()
		},

		cache: new Map(),

		async GET(name) {
			let content = this.cache.get(name)
			if (!!content) return content;

			const res = await fetch("/raw/" + this.playID + "/" + name, {method: 'GET', cache: "no-store"})
			if (!res.ok) throw {status: res.status, body: await res.text()}
			content = await res.text()
			this.cache.set(name, content)
			return content
		},

		async DELETE(name) {
			const res = await fetch("/" + this.playID + "/" + name, {method: 'DELETE', cache: "no-store"})
			if (!res.ok && res.status !== 400) throw {status: res.status, body: await res.text()}
			this.cache.delete(name)
			return await res.text()
		},

		async PUT(name, body) {
			const res = await fetch("/" + this.playID + "/" + name, {method: 'PUT', body, cache: "no-store"})
			if (!res.ok && res.status !== 400) throw {status: res.status, body: await res.text()}
			this.cache.set(name, body)
			return await res.text()
		},

	}


</script>
