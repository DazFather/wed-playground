<style>
	display: flex;
	flex-direction: column;
	height: 100%;
	background-color: var(--dark-carbon, gray);
	border-radius: var(--unit);
	overflow: hidden;
	border: var(--unit-mini) solid var(--dark-carbon, gray); 
	gap: var(--unit-mini); 

	.sideview-wrapper {
		height: 75%;
		gap: inherit;
		
		.sideview {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			border-radius: var(--unit-small);
			overflow: hidden;
			gap: var(--unit-mini);

			* {
				gap: inherit;
				border-radius: var(--unit-mini);
			}
		}
	}

	button, input, textarea, figure, iframe {
		margin: 0;
		padding: 0;
		border: none;
		outline: none;
		resize: none;
		background-color: var(--color-bg);
		transition-duration: var(--speed);
		transition-properties: all;
	}

	.terminal {
		height: 25%;
	}

</style>
<html>
	<section class="flex-center sideview-wrapper">
		<div class="sideview">
			{{ use "file-editor" ( args "bindcontent" "content" ) }}
		</div>
		<aside class="sideview">
			{{ use "preview" ( args "bindframe" "preview" ) }}
		</aside>
	</section>
	<aside class="terminal">
		{{ use "term" ( args 
			"title"       "wed build"
			"placeholder" "Project initialized"
		) }}
	</aside>
</html>
<script>
	const show = useDisplay("#term")
	const playID = useEffect("std", id => {
		refresh(id)
		return id
	})

	const editor = useBinds(".editor-component")

	async function run(id=playID.value) {
		const name = activeTab.value.querySelector(".open-btn").value
		const out = await http("/" + id + "/" + name, 'PUT', editor.content, r => !r.ok && r.status !== 400)
		show(out)
		refresh(id)
	}

	function refresh(id=playID.value) {
		editor.preview = `/preview/${ id }/`
	}

	async function checkerr(res) {
		if (!res.ok) throw await res.text()
		return res
	}

	function http(path, method='GET', body=null, fails=(res) => !res.ok) {
		return fetch(path, {method, body, cache: "no-store"})
			.then(res => { if (fails(res)) throw res; return res} )
			.then(res => res.text())
			.catch(res => res.text().then(msg => window.alert(msg)))
	}
</script>
