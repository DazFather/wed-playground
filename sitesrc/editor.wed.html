<style>
	display: flex;
	flex-direction: column;
	height: 100%;
	background-color: var(--dark-carbon, gray);
	border-radius: var(--unit);
	overflow: hidden;
	border: var(--unit-mini) solid var(--dark-carbon, gray); 
	gap: var(--unit-mini); 

	.sideview-wrapper {
		height: 75%;
		gap: inherit;
		
		.sideview {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			border-radius: var(--unit-small);
			overflow: hidden;
			gap: var(--unit-mini);

			* {
				gap: inherit;
				border-radius: var(--unit-mini);
			}
		}
	}

	button, input, textarea, figure, iframe {
		margin: 0;
		padding: 0;
		border: none;
		outline: none;
		resize: none;
	}

	.terminal {
		height: 25%;
	}

</style>
<html>
	<section class="flex-center sideview-wrapper">
		<div class="sideview">
			{{ use "file-editor" ( args "bindcontent" "content" ) }}
		</div>
		<aside class="sideview">
			{{ use "preview" ( args "bindframe" "preview" ) }}
		</aside>
	</section>
	<aside class="terminal">
		{{ use "term" ( args 
			"title"       "wed build"
			"placeholder" "Project initialized"
		) }}
	</aside>
</html>
<script>
	const show = useDisplay("#term")
	const playID = useEffect("std", id => {
		refresh(id)
		return id
	})

	const editor = useBinds(".editor-component")
	editor.file = "app.wed.html"

	function run(id=playID.value) {
		return fetch(`/${ id }/${ editor.file }`, {method: 'PUT', body: editor.content})
			.then(res => { if (!res.ok && res.status !== 400) throw res; return res })
			.then(res => res.text())
			.then(out => {
				show(out)
				refresh(id)
			})
			.catch(err => err.text().then(msg => window.alert(msg)))
	}

	function refresh(id=playID.value) {
		editor.preview = `/preview/${ id }/`
		return fetch(`/raw/${ id }/` + editor.file)
			.then(res => checkerr(res))
			.then(res => res.text())
			.then(txt => editor.content = txt)
			.catch(err => window.alert(err))
	}

	async function checkerr(res) {
		if (!res.ok) throw await res.text()
		return res
	}
</script>
